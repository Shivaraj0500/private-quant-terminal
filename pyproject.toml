[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "private-quant-terminal"
version = "0.1.0"
description = "AI-assisted quantitative strategy research and execution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "TA-Lib==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
